<style>
/* Layout: header + tab bar, then one view at a time; summary first, detail below */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#14202b; --muted:#5d6b78; --line:#dde3e9;
  --accent:#1f4e79; --accent-soft:#e3edf6;
  --ok:#2f7d4f; --ok-soft:#e1f1e8; --warn:#a96a00; --warn-soft:#fbefd5; --bad:#b4372f; --bad-soft:#f8e1de;
  --stage:#3b6ea5; --track:#e6ebf0; --w7:#c9a227; --w5:#b7791f; --w3:#c2410c;
  --f-body:'Plus Jakarta Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#17212b; --fg:#e6edf3; --muted:#93a1ae; --line:#27333f;
  --accent:#7fb2e5; --accent-soft:#1c2d3f;
  --ok:#5cc08a; --ok-soft:#173326; --warn:#e3a94a; --warn-soft:#3a2d12; --bad:#ef7d74; --bad-soft:#3e1d1a;
  --stage:#6aa0d6; --track:#243240; --w7:#d9b84a; --w5:#e3a94a; --w3:#f08a4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --fg:#e6edf3; --muted:#93a1ae; --line:#27333f;
  --accent:#7fb2e5; --accent-soft:#1c2d3f;
  --ok:#5cc08a; --ok-soft:#173326; --warn:#e3a94a; --warn-soft:#3a2d12; --bad:#ef7d74; --bad-soft:#3e1d1a;
  --stage:#6aa0d6; --track:#243240; --w7:#d9b84a; --w5:#e3a94a; --w3:#f08a4b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.demo{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:999px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer}
.kpi[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:6px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h2{font-size:14px;margin:0 0 12px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.bar .n{line-height:1.3}
.bar .t{height:10px;background:var(--track);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--stage);border-radius:3px}
.bar .c{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.m{font-family:var(--f-mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cl{font-weight:600}.cl small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.steps{display:flex;gap:3px;min-width:120px}
.steps i{flex:1;height:6px;border-radius:2px;background:var(--track)}
.steps i.on{background:var(--stage)} .steps i.done{background:var(--ok)}
.stl{font-size:12px;margin-top:4px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neu{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-weight:600;font-size:13px;background:none;border:0;padding:7px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.person{text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.person[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.person .top{display:flex;justify-content:space-between;align-items:baseline}
.person b{font-size:15px}
.person .num{font-family:var(--f-mono);font-size:20px;font-weight:500}
.load{display:flex;height:8px;border-radius:3px;overflow:hidden;background:var(--track)}
.load i{display:block;height:100%}
.load .a{background:var(--stage)} .load .w{background:var(--warn)} .load .b{background:var(--bad)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.empty{color:var(--muted);padding:20px;text-align:center}
.legend button{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:6px;padding:2px 8px;cursor:pointer}
.legend button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.load i{cursor:pointer}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend button::before,.legend span[style]::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
@media (max-width:520px){.bar{grid-template-columns:120px 1fr 30px}}
</style>

</head>

const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const STAGES=["Report submitted","On review by Reviewer","On review by Certifier","Waiting feedback (contractor-auditor)","On finalize process by Certifier","Positive Decision","Done Certified"];
const $=s=>document.querySelector(s);
const fmt=d=>!d?"–":new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
const days=d=>!d?null:Math.round((new Date(d+"T00:00:00")-TODAY)/864e5);
const isoLocal=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
DATA.forEach(r=>{
  r.revRemain=r.stage<3?days(r.revDl):null;
  r.active=r.stage<7; r.deadline=r.stage===6?r.wiDl:r.decisionDl; r.dlLabel=r.stage===6?"batas penerbitan":"batas keputusan"; r.remain=days(r.deadline);
  r.risk=!r.active?"done":r.remain<0?"bad":r.remain<=3?"warn":"ok";
});
const riskPill=r=>r.risk==="done"?'<span class="pill ok">Selesai</span>':r.risk==="bad"?`<span class="pill bad">Terlambat ${-r.remain} hr</span>`:r.risk==="warn"?`<span class="pill warn">${r.remain} hr lagi</span>`:`<span class="pill neu">${r.remain} hr lagi</span>`;
const steps=s=>'<div class="steps">'+STAGES.map((_,i)=>`<i class="${i+1<s||s===7?'done':i+1===s?'on':''}"></i>`).join("")+'</div>';
const count=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const bars=(entries)=>{const mx=Math.max(1,...entries.map(e=>e[1]));return '<div class="bars">'+entries.map(([n,c])=>`<div class="bar"><span class="n" title="${n}">${n}</span><span class="t"><i style="width:${c/mx*100}%"></i></span><span class="c">${c}</span></div>`).join("")+'</div>'};

function ringkasan(){
  const act=DATA.filter(r=>r.active), late=act.filter(r=>r.risk==="bad"), warn=act.filter(r=>r.risk==="warn");
  const nc=act.reduce((a,r)=>a+r.ncMajor+r.ncMinor,0);
  const fo=focusView(act,late,warn);
  const stageCounts=STAGES.map((s,i)=>[s,DATA.filter(r=>r.stage===i+1).length]);
  return `<div style="display:flex;flex-direction:column;gap:14px">
  <div class="kpis">
    <button class="kpi" data-f="active" aria-pressed="${focus==='active'}"><div class="l">Project berjalan</div><div class="v">${act.length}</div><div class="h">dari ${DATA.length} project</div></button>
    <button class="kpi bad" data-f="late" aria-pressed="${focus==='late'}"><div class="l">Lewat deadline</div><div class="v">${late.length}</div><div class="h">perlu eskalasi</div></button>
    <button class="kpi warn" data-f="warn" aria-pressed="${focus==='warn'}"><div class="l">Deadline ≤ 3 hari</div><div class="v">${warn.length}</div><div class="h">perlu perhatian</div></button>
    <button class="kpi" data-f="nc" aria-pressed="${focus==='nc'}"><div class="l">NC terbuka</div><div class="v">${nc}</div><div class="h">major + minor</div></button>
    <button class="kpi ok" data-f="done" aria-pressed="${focus==='done'}"><div class="l">Tersertifikasi</div><div class="v">${DATA.length-act.length}</div><div class="h">sejak Okt 2025</div></button>
  </div>
  <div class="grid2">
    <div class="panel"><h2>Project per Certification Status</h2>${bars(stageCounts)}</div>
    <div class="panel"><h2>Project berjalan per Responsible Office</h2>${bars(count(act,r=>r.office))}
      <h2 style="margin-top:18px">Per program</h2>${bars(count(act,r=>r.program).slice(0,6))}</div>
  </div>
  <div class="panel"><h2>Sertifikat terbit per bulan <span class="sub" style="font-weight:400">· dari kolom Actual Date of Certificate Issuance</span></h2>${monthly()}</div>
  <div class="panel" id="focus"><h2>${fo.title}</h2>${fo.html}</div>
  </div>`;
}

let focus="urgent";
const FOCUS_TITLE={urgent:"Perlu tindakan segera",active:"Perlu tindakan segera · semua project berjalan",late:"Perlu tindakan segera · lewat deadline",warn:"Perlu tindakan segera · deadline ≤ 3 hari",nc:"Perlu tindakan segera · NC terbuka",done:"Project tersertifikasi"};
function dl(a){return '<dl>'+a.filter(Boolean).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")+'</dl>'}
function detail(r){
  return `<article class="dcard"><div class="dh"><div class="cl">${r.client}<small>${r.no} · ${r.office} · ${r.program} · ${r.type}</small></div>${riskPill(r)}</div>
  <div>${steps(r.stage)}<div class="stl">${STAGES[r.stage-1]}</div></div>
  ${dl([["Audit",fmt(r.start)+" – "+fmt(r.end)],["Total Unit",r.units],["Certifier",r.certifier],["Report checked by",r.reviewer],
   r.stage<3?["Deadline reviewer ke certifier",r.revDl?fmt(r.revDl):"belum diisi di Excel"]:null,["Deadline keputusan (30 hari)",fmt(r.decisionDl)],["Deadline as per WI (60 hari)",fmt(r.wiDl)],
   ["NC terbuka (major / minor)",`${r.ncMajor} / ${r.ncMinor}`],["Status review time",r.review],
   r.issued?["Actual Date of Certificate Issuance",fmt(r.issued)]:null,["Last Validity",fmt(r.validity)],r.note?["Keterangan",r.note]:null])}</article>`;
}
const addD=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return isoLocal(d)};
function ncCell(iso,n){
  if(!n||!iso)return n?"belum diisi":"–";
  const rm=days(iso),c=rm<0?"var(--bad)":rm<=3?"var(--warn)":"var(--muted)";
  return `${fmt(iso)}<div class="stl" style="color:${c}">${rm<0?"terlambat "+(-rm)+" hr":rm+" hr lagi"}</div>`;
}
function mini(rows,nc){
  return `<div class="tablewrap" style="border:0"><table style="min-width:${nc?980:720}px"><thead><tr><th>No Project</th><th>Program</th><th>Audit (start – end)</th><th>Certifier</th><th>Report checked by</th>${nc?"":"<th>Release certificate</th>"}${nc?'<th>NC Major</th><th>NC Minor</th><th>Total NC</th><th>Deadline Major</th><th>Deadline Minor</th>':""}</tr></thead><tbody>`+
  rows.map(r=>`<tr><td class="m">${r.no}</td><td>${r.program}</td><td class="m">${fmt(r.start)} – ${fmt(r.end)}</td><td>${r.certifier}</td><td>${r.reviewer}</td>${nc?"":`<td class="m">${r.issued?fmt(r.issued):"–"}</td>`}${nc?`<td class="m">${r.ncMajor?`<b style="color:var(--bad)">${r.ncMajor}</b>`:0}</td><td class="m">${r.ncMinor}</td><td class="m"><b>${r.ncMajor+r.ncMinor}</b></td><td class="m">${ncCell(r.dlMajor,r.ncMajor)}</td><td class="m">${ncCell(r.dlMinor,r.ncMinor)}</td>`:""}</tr>`).join("")+'</tbody></table></div>';
}
function focusView(act,late,warn){
  let rows;
  if(focus==="late")rows=late;else if(focus==="warn")rows=warn;else if(focus==="active")rows=act;
  else if(focus==="nc")rows=act.filter(r=>r.ncMajor+r.ncMinor>0);
  else if(focus==="done")rows=DATA.filter(r=>!r.active).sort((a,b)=>(b.issued||"").localeCompare(a.issued||""));
  else rows=late.concat(warn);
  if(focus!=="done")rows=rows.slice().sort((a,b)=>a.remain-b.remain);
  const compact=["active","nc","done"].includes(focus);const cap=compact?15:12,shown=rows.slice(0,cap);
  return {title:FOCUS_TITLE[focus]+` · ${rows.length} project`+(focus==="nc"?` · ${rows.reduce((s,r)=>s+r.ncMajor+r.ncMinor,0)} NC (${rows.reduce((s,r)=>s+r.ncMajor,0)} major, ${rows.reduce((s,r)=>s+r.ncMinor,0)} minor)`:""),
    html:rows.length?(compact?mini(shown,focus==="nc"):`<div class="dgrid">${shown.map(detail).join("")}</div>`)+(rows.length>cap?`<p class="sub" style="margin:12px 0 0">${rows.length-cap} project lainnya ada di tab Project.</p>`:""):'<div class="empty">Tidak ada project di kategori ini.</div>'};
}
function monthly(){
  const m={};DATA.filter(r=>r.issued).forEach(r=>{const k=r.issued.slice(0,7);m[k]=(m[k]||0)+1});
  const keys=Object.keys(m).sort();
  return bars(keys.map(k=>[new Date(k+"-01T00:00:00").toLocaleDateString("id-ID",{month:"short",year:"2-digit"}),m[k]]));
}
function tbl(rows,compact){
  if(!rows.length)return '<div class="empty">Tidak ada project yang cocok.</div>';
  return `<div class="tablewrap" style="${compact?'border:0':''}"><table style="min-width:980px"><thead><tr><th>No Project</th><th>Client Name</th><th>Program</th><th>Certification Status</th><th>Certifier</th><th>Report checked by</th><th>NC</th><th>Deadline</th><th>Last Validity</th></tr></thead><tbody>`+
  rows.map(r=>`<tr><td class="m">${r.no}</td><td class="cl">${r.client}<small>${r.office} · ${r.type} · Auditor ${r.auditor}</small>${r.note?`<small style="color:var(--warn)">${r.note}</small>`:""}</td><td>${r.program}</td>
  <td>${steps(r.stage)}<div class="stl">${STAGES[r.stage-1]}</div></td><td>${r.certifier}</td><td>${r.reviewer}</td>
  <td class="m">${r.ncMajor||r.ncMinor?`<b style="color:var(--bad)">${r.ncMajor}</b> / ${r.ncMinor}`:'–'}</td>
  <td>${riskPill(r)}<div class="stl">${r.active?r.dlLabel+" "+fmt(r.deadline):"issued "+fmt(r.issued)}</div></td><td class="m">${fmt(r.validity)}${r.validity&&days(r.validity)<0?`<div class="stl" style="color:var(--bad)">sudah lewat</div>`:""}</td></tr>`).join("")+'</tbody></table></div>';
}

const st={q:"",office:"",stage:"",risk:""};
function project(){
  const opts=(arr,all)=>`<option value="">${all}</option>`+arr.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join("");
  return `<div style="display:flex;flex-direction:column;gap:12px">
  <div class="tools">
    <input type="search" id="q" placeholder="Cari client atau no project" value="${st.q}">
    <select id="fo" aria-label="Responsible Office">${opts([...new Set(DATA.map(r=>r.office))].map(o=>[o,o]),"Responsible Office")}</select>
    <select id="fs" aria-label="Certification Status">${opts(STAGES.map((s,i)=>[i+1,s]),"Certification Status")}</select>
    <select id="fr">${opts([["bad","Terlambat"],["warn","≤ 3 hari"],["ok","Normal"],["done","Selesai"]],"Status deadline")}</select>
  </div><div id="plist"></div></div>`;
}
function plist(){
  const q=st.q.toLowerCase();
  const rows=DATA.filter(r=>(!q||r.client.toLowerCase().includes(q)||r.no.includes(q))&&(!st.office||r.office===st.office)&&(!st.stage||r.stage==st.stage)&&(!st.risk||r.risk===st.risk));
  $("#plist").innerHTML=`<div class="sub" style="margin-bottom:8px">${rows.length} project</div>`+tbl(rows);
}
function bindProject(){
  $("#fo").value=st.office;$("#fs").value=st.stage;$("#fr").value=st.risk;
  $("#q").oninput=e=>{st.q=e.target.value;plist()};
  $("#fo").onchange=e=>{st.office=e.target.value;plist()};
  $("#fs").onchange=e=>{st.stage=e.target.value;plist()};
  $("#fr").onchange=e=>{st.risk=e.target.value;plist()};
  plist();
}

const CATS={
  certifier:[{k:"ok",l:"Normal",c:"var(--stage)",m:""},{k:"warn",l:"≤ 3 hari",c:"var(--warn)",m:"≤ 3 hr"},{k:"bad",l:"Terlambat",c:"var(--bad)",m:"terlambat"}],
  reviewer:[{k:"ok",l:"Normal",c:"var(--stage)",m:"",t:"Review sudah dikirim ke certifier lebih cepat dari deadline reviewer"},{k:"d3",l:"≤ 3 hari",c:"var(--w3)",m:"≤ 3 hr"},{k:"d5",l:"≤ 5 hari",c:"var(--w5)",m:"≤ 5 hr"},{k:"d7",l:"≤ 7 hari",c:"var(--w7)",m:"≤ 7 hr"},{k:"bad",l:"Terlambat",c:"var(--bad)",m:"terlambat",t:"Tidak masuk kategori ≤ 3, ≤ 5, atau ≤ 7 hari, atau review selesai terlambat"}]};
const rk=r=>{
  if(ind.role!=="reviewer")return r.risk;
  if(r.stage>=3)return r.review==="Late Time"?"bad":"ok";
  const m=r.revRemain;return m!=null&&m>=0&&m<=3?"d3":m>=0&&m<=5?"d5":m>=0&&m<=7?"d7":"bad";
};
const RLABEL={ok:"Normal",warn:"≤ 3 hari",bad:"Terlambat"};
const ROLES={certifier:"Certifier",reviewer:"Reviewer"};
function individu(){
  const cats=CATS[ind.role];
  if(ind.risk&&!cats.some(c=>c.k===ind.risk)){ind.risk="";ind.all=false}
  const act=DATA.filter(r=>r.active), by={};
  act.forEach(r=>{(by[r[ind.role]]=by[r[ind.role]]||[]).push(r)});
  const names=Object.keys(by).sort((a,b)=>by[b].length-by[a].length);
  if(!ind.person||!by[ind.person])ind.person=names[0];
  const cards=names.map(n=>{
    const l=by[n],cnt=Object.fromEntries(cats.map(c=>[c.k,l.filter(r=>rk(r)===c.k).length]));
    return `<button class="person" data-p="${n}" aria-pressed="${n===ind.person}"><div class="top"><b>${n}</b><span class="num">${l.length}</span></div>
    <div class="load" title="Klik segmen untuk melihat detail project">${cats.map(c=>`<i data-k="${c.k}" data-pp="${n}" style="background:${c.c};width:${cnt[c.k]/l.length*100}%"></i>`).join("")}</div>
    <div class="meta">${cats.filter(c=>c.k!=="ok").map(c=>`<span>${cnt[c.k]} ${c.m}</span>`).join("")}<span>${l.reduce((s,r)=>s+r.ncMajor+r.ncMinor,0)} NC</span></div></button>`}).join("");
  const wide=ind.all&&ind.risk;
  let mine=(wide?Object.values(by).flat():(by[ind.person]||[])).filter(r=>!ind.risk||rk(r)===ind.risk).sort((a,b)=>a.remain-b.remain);
  const cap=12,body=!mine.length?'<div class="empty">Tidak ada project di kategori ini.</div>':ind.risk?`<div class="dgrid">${mine.slice(0,cap).map(detail).join("")}</div>`+(mine.length>cap?`<p class="sub" style="margin:12px 0 0">${mine.length-cap} project lainnya ada di tab Project.</p>`:""):tbl(mine,true);
  return `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="seg" id="roles" style="align-self:flex-start">${Object.entries(ROLES).map(([k,v])=>`<button data-r="${k}" aria-pressed="${k===ind.role}">${v}</button>`).join("")}</div>
    <div class="legend">${cats.map(c=>`<button data-lg="${c.k}" title="${c.t||""}" aria-pressed="${ind.risk===c.k}" style="--c:${c.c}">${c.l}</button>`).join("")}<span>Klik kategori atau segmen bar untuk melihat detail project</span></div>
    <div class="people">${cards}</div>
    <div class="panel"><h2>Task assignment: ${wide?"semua "+ROLES[ind.role]:ind.person+" ("+ROLES[ind.role]+")"}${ind.risk?" · "+cats.find(c=>c.k===ind.risk).l:""} · ${mine.length} project</h2>${body}</div></div>`;
}

const views={ringkasan:()=>[ringkasan(),()=>{document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{focus=focus===b.dataset.f?"urgent":b.dataset.f;render("ringkasan");const f=document.getElementById("focus");f&&f.scrollIntoView({behavior:"smooth",block:"nearest"})})}],project:()=>[project(),bindProject],individu:()=>[individu(),()=>{
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ind.role=b.dataset.r;ind.person=null;ind.risk="";ind.all=false;render("individu")});
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ind.person=b.dataset.p;ind.all=false;render("individu")});
  document.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{ind.risk=ind.risk===b.dataset.lg?"":b.dataset.lg;ind.all=!!ind.risk;render("individu")});
  document.querySelectorAll(".load i").forEach(i=>i.onclick=e=>{e.stopPropagation();ind.person=i.dataset.pp;ind.risk=ind.risk===i.dataset.k&&!ind.all?"":i.dataset.k;ind.all=false;render("individu")});
}]};
function render(v){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  const [html,bind]=views[v]();$("#view").innerHTML=html;bind();
  try{history.replaceState(null,"","#"+v)}catch(e){}
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>render(b.dataset.v));
$("#today").textContent=TODAY.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
const h=location.hash.slice(1);render(views[h]?h:"ringkasan");
window.addEventListener("hashchange",()=>{const x=location.hash.slice(1);if(views[x])render(x)});
</script>
</body>
</html>

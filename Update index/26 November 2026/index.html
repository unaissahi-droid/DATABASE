/* Layout: header + tab bar, then one view at a time; summary first, detail below */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#14202b; --muted:#5d6b78; --line:#dde3e9;
  --accent:#1f4e79; --accent-soft:#e3edf6;

  --stage:#3b6ea5; --track:#e6ebf0; --w7:#c9a227; --w5:#b7791f; --w3:#c2410c;
  --f-body:'Plus Jakarta Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#17212b; --fg:#e6edf3; --muted:#93a1ae; --line:#27333f;
  --accent:#7fb2e5; --accent-soft:#1c2d3f;
  --ok:#5cc08a; --ok-soft:#173326; --warn:#e3a94a; --warn-soft:#3a2d12; --bad:#ef7d74; --bad-soft:#3e1d1a;
  --stage:#6aa0d6; --track:#243240; --w7:#d9b84a; --w5:#e3a94a; --w3:#f08a4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --fg:#e6edf3; --muted:#93a1ae; --line:#27333f;
  --accent:#7fb2e5; --accent-soft:#1c2d3f;
  --ok:#5cc08a; --ok-soft:#173326; --warn:#e3a94a; --warn-soft:#3a2d12; --bad:#ef7d74; --bad-soft:#3e1d1a;
  --stage:#6aa0d6; --track:#243240; --w7:#d9b84a; --w5:#e3a94a; --w3:#f08a4b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.demo{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:999px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer}
.kpi[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:6px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h2{font-size:14px;margin:0 0 12px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.bar .n{line-height:1.3}
.bar .t{height:10px;background:var(--track);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--stage);border-radius:3px}
.bar .c{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.m{font-family:var(--f-mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cl{font-weight:600}.cl small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.steps{display:flex;gap:3px;min-width:120px}
.steps i{flex:1;height:6px;border-radius:2px;background:var(--track)}
.steps i.on{background:var(--stage)} .steps i.done{background:var(--ok)}
.stl{font-size:12px;margin-top:4px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neu{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-weight:600;font-size:13px;background:none;border:0;padding:7px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.person{text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.person[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.person .top{display:flex;justify-content:space-between;align-items:baseline}
.person b{font-size:15px}
.person .num{font-family:var(--f-mono);font-size:20px;font-weight:500}
.load{display:flex;height:8px;border-radius:3px;overflow:hidden;background:var(--track)}
.load i{display:block;height:100%}
.load .a{background:var(--stage)} .load .w{background:var(--warn)} .load .b{background:var(--bad)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.empty{color:var(--muted);padding:20px;text-align:center}
.legend button{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:6px;padding:2px 8px;cursor:pointer}
.legend button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.load i{cursor:pointer}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend button::before,.legend span[style]::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.hm{border-collapse:separate;border-spacing:0;min-width:0;width:auto}
.hm th,.hm td{padding:0;border-bottom:1px solid var(--line)}
.hm th.nm,.hm td.nm{position:sticky;left:0;background:var(--surface);padding:6px 12px 6px 0;font-weight:600;white-space:nowrap;z-index:1;min-width:96px}
.hm th.hd{font-size:10px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;text-align:center;min-width:34px;padding:6px 2px;line-height:1.25}
.hm th.hd b{display:block;font-size:12px;color:var(--fg);font-weight:600}
.hm th.today{box-shadow:inset 0 -2px 0 var(--accent)}
.hm td.hc{text-align:center;font-family:var(--f-mono);font-size:12px;height:34px;border-left:1px solid var(--surface)}
.hm td.fut{color:var(--muted);opacity:.5}
.hm td.lv{background:repeating-linear-gradient(45deg,var(--warn-soft),var(--warn-soft) 4px,var(--surface) 4px,var(--surface) 8px);color:var(--warn);font-weight:600}
.hm td.today{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.hmwrap{overflow-x:auto}
.mbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mbar .mo{font-weight:600;min-width:130px;text-align:center}
.btn{font:inherit;font-weight:600;font-size:13px;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
a.btn{text-decoration:none;display:inline-block}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 4px 2px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.chip button{font:inherit;line-height:1;border:0;background:none;color:inherit;cursor:pointer;padding:2px 5px;border-radius:999px}
details.grp{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface)}
details.grp summary{cursor:pointer;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.grp .tablewrap{border:0;border-top:1px solid var(--line);border-radius:0}
.frm{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.frm label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
@media (max-width:520px){.bar{grid-template-columns:120px 1fr 30px}}
</style>

</head>

<script>
/* Penyimpanan lokal (browser ini saja) untuk cuti dan email tim, pengganti database di halaman Artifact */
(function(){
  if(window.claude)return;
  var KEY="mtx-assignment-v1",store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
  var subs=[];
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
  function notify(){subs.slice().forEach(function(f){f()})}
  function snap(p){return{id:p.split("/").pop(),exists:p in store,data:function(){return store[p]}}}
  function sub(f){subs.push(f);setTimeout(f,0);return function(){var i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}
  var db={
    doc:function(p){return{
      set:function(d){store[p]=JSON.parse(JSON.stringify(d));save();notify();return Promise.resolve()},
      delete:function(){delete store[p];save();notify();return Promise.resolve()},
      onSnapshot:function(next){return sub(function(){next(snap(p))})}}},
    collection:function(c){return{onSnapshot:function(next){return sub(function(){
      next({docs:Object.keys(store).filter(function(k){return k.indexOf(c+"/")===0&&k.split("/").length===2}).map(snap)})})}}}
  };
  var dl={save:function(o){
    var u=URL.createObjectURL(new Blob([o.data],{type:"text/csv"})),a=document.createElement("a");
    a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},1000);return Promise.resolve({status:"saved"})}};
  window.claude={use:function(n){return Promise.resolve(n==="db"?db:n==="user"?{can:function(){return Promise.resolve(true)}}:n==="downloads"?dl:null)}};
})();
</script>

const fmt=d=>!d?"–":new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
const days=d=>!d?null:Math.round((new Date(d+"T00:00:00")-TODAY)/864e5);
const isoLocal=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

  r.revRemain=r.stage<3?days(r.revDl):null;

function weekdaysOf(ym){const [y,m]=ym.split("-").map(Number);const out=[];for(let d=1;;d++){const x=new Date(y,m-1,d);if(x.getMonth()!==m-1)break;if(x.getDay()%6)out.push(isoLocal(x))}return out}
const lvKey=(p,d)=>slug(p)+"_"+d;

function calc(role){
  const ym=asg.month,days=weekdaysOf(ym),end=role==="certifier"?"certEnd":"revEnd";
  const rows=DATA.filter(r=>r.assign&&r[role]!=="Belum ditugaskan");
  const lo=isoLocal(new Date(isoD(days[0]).getTime()-30*864e5));
  const people=[...new Set(rows.filter(r=>(r[end]||TODAY_ISO)>=lo&&r.assign<=days[days.length-1]).map(r=>r[role]))].sort();
  const load=(p,d)=>{let n=0;for(const r of rows)if(r[role]===p&&r.assign<=d&&d<=(r[end]||TODAY_ISO))n++;return n};
  const isLv=(p,d)=>!!LEAVE[lvKey(p,d)];
  const elapsed=days.filter(d=>d<=TODAY_ISO);
  const recap=people.map(p=>{
    const lvAll=days.filter(d=>isLv(p,d)).length,lvEl=elapsed.filter(d=>isLv(p,d)).length;
    const loads=elapsed.filter(d=>!isLv(p,d)).map(d=>load(p,d));
    const effEl=elapsed.length-lvEl,sum=loads.reduce((a,b)=>a+b,0);
    return {role,p,work:days.length,leave:lvAll,eff:days.length-lvAll,activeDays:loads.filter(n=>n>0).length,effEl,
      avg:effEl?sum/effEl:0,peak:loads.length?Math.max(...loads):0,
      newA:rows.filter(r=>r[role]===p&&r.assign.startsWith(ym)).length,
      done:rows.filter(r=>r[role]===p&&r[end]&&r[end].startsWith(ym)).length};

  const hist=Object.keys(groups).sort().reverse().map((d,i)=>`<details class="grp" ${i===0?"open":""}><summary>${DOWF[dowOf(d)]}, ${fmtD(d)} <span class="pill neu">${groups[d].length} project</span>${SCHED.includes(dowOf(d))?"":'<span class="pill warn">di luar jadwal</span>'}</summary>
    ${batchBar(d,groups[d])}<div class="tablewrap"><table style="min-width:820px"><thead><tr><th>No Project</th><th>Client Name</th><th>Program</th><th>Certifier</th><th>Report checked by</th><th>Certification Status</th><th>Kirim assignment</th></tr></thead><tbody>`+
    groups[d].map(r=>`<tr><td class="m">${esc(r.no)}</td><td class="cl">${esc(r.client)}<small>${esc(r.office)} · ${esc(r.type)}</small></td><td>${esc(r.program)}</td><td>${esc(r.certifier)}</td><td>${esc(r.reviewer)}</td><td>${STAGES[r.stage-1]}</td><td style="white-space:nowrap">${sendBtns(r)}</td></tr>`).join("")+`</tbody></table></div></details>`).join("");
  return `<div style="display:flex;flex-direction:column;gap:14px">
  <div class="mbar"><div class="seg" id="roles"><button data-r="certifier" aria-pressed="${role==="certifier"}">Certifier</button><button data-r="reviewer" aria-pressed="${role==="reviewer"}">Reviewer</button></div>
    <div class="mbar" style="margin-left:auto"><button class="btn" id="mprev" aria-label="Bulan sebelumnya" ${ym<="2025-10"?"disabled":""}>‹</button><span class="mo">${monthLabel(ym)}</span><button class="btn" id="mnext" aria-label="Bulan berikutnya" ${ym>=TODAY_ISO.slice(0,7)?"disabled":""}>›</button></div></div>
  <div class="grid2">
    <div class="panel"><h2>Menunggu assignment · ${pending.length} project</h2>${pending.length?pending.map(r=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(r.client)}</b><div class="sub">${esc(r.no)} · ${esc(r.program)} · ${STAGES[r.stage-1]} · ${!r.assign?"belum ada tanggal assignment":"certifier atau reviewer belum ditugaskan"}</div></div>`).join(""):'<div class="empty" style="padding:10px">Semua project berjalan sudah ditugaskan.</div>'}</div>
  </div>
  <div class="panel"><h2>Workload harian ${ROLE} · ${monthLabel(ym)}</h2>${hm}</div>
  <div class="panel"><h2>Rekap lama kerja ${monthLabel(ym)}</h2>${rc}
    <div class="frm" style="margin-top:12px"><button class="btn" id="exCopy">Salin rekap (Certifier + Reviewer)</button><button class="btn" id="exCsv">Unduh CSV</button><span class="sub" id="exMsg">${esc(asg.msg)}</span></div></div>
  <div class="panel"><h2>Cuti · ${monthLabel(ym)}</h2>${lvForm}${lvList}</div>
  ${emailPanel(everyone)}
  <div><h2 style="font-size:14px;margin:0 0 10px;font-weight:600">Riwayat assignment · 4 minggu terakhir</h2>${hist||'<div class="panel empty">Belum ada assignment dalam 4 minggu terakhir.</div>'}</div>
  </div>`;
}

/* ===== Kirim assignment (Outlook) ===== */
let PEOPLE={};
const NO_MAIL=new Set(["Mai"]);
const emailOf=n=>(PEOPLE[slug(n)]||{}).email||"";
const okMail=s=>/^[^\s@<>"',;]+@[^\s@<>"',;]+\.[^\s@<>"',;]+$/.test(s);
const OL_MAIL="https://outlook.office.com/mail/deeplink/compose";
const OL_CAL="https://outlook.office.com/calendar/deeplink/compose";
const qs=o=>Object.entries(o).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
const RN={certifier:"Certifier",reviewer:"Reviewer"};
function asgText(r,role){
  const dl=role==="reviewer"?"Deadline reviewer ke certifier: "+fmt(r.revDl):"Deadline keputusan sertifikasi: "+fmt(r.decisionDl);
  return `Halo ${r[role]},\n\nBerikut assignment ${RN[role]} untuk project:\n- Client: ${r.client}\n- No Project: ${r.no}\n- Program: ${r.program}\n- Responsible Office: ${r.office}\n- Jenis inspeksi: ${r.type}\n- Tanggal audit: ${fmt(r.start)} - ${fmt(r.end)}\n- Tanggal assignment: ${fmt(r.assign)}\n- ${dl}\n\nMohon konfirmasi penerimaan. Terima kasih.`;
}
const offBtn=(label,why)=>`<span class="btn" style="opacity:.45;cursor:not-allowed" title="${esc(why)}">${label}</span>`;
function sendBtns(r){
  const role=asg.role,name=r[role],em=emailOf(name);
  if(name==="Belum ditugaskan"||NO_MAIL.has(name))return '<span class="sub">–</span>';
  if(!em)return offBtn("Email","Isi email "+name+" di panel Email tim")+" "+offBtn("Kalender","Isi email "+name+" di panel Email tim");
  const mail=OL_MAIL+"?"+qs({to:em,subject:`Assignment ${RN[role]}: ${r.client} (${r.no})`,body:asgText(r,role)});
  const dl=role==="reviewer"?r.revDl:r.decisionDl;
  const cal=dl?OL_CAL+"?"+qs({subject:`Deadline ${RN[role]}: ${r.client} (${r.no})`,body:asgText(r,role),startdt:dl+"T00:00:00",enddt:addD(dl,1)+"T00:00:00",allday:"true",to:em}):"";
  return `<a class="btn" target="_blank" rel="noopener" href="${esc(mail)}">Email</a> `+(cal?`<a class="btn" target="_blank" rel="noopener" href="${esc(cal)}">Kalender</a>`:offBtn("Kalender","Deadline belum diisi di Excel"));
}
function batchBar(d,rows){
  const role=asg.role,names=[...new Set(rows.map(r=>r[role]))].filter(n=>n!=="Belum ditugaskan"&&!NO_MAIL.has(n));
  const to=names.map(emailOf).filter(Boolean),miss=names.filter(n=>!emailOf(n));
  if(!to.length)return `<div style="padding:8px 14px" class="sub">Isi email ${RN[role]} di panel Email tim untuk mengirim assignment.</div>`;
  const subject=`Assignment ${RN[role]} ${DOWF[dowOf(d)]}, ${fmt(d)}`;
  const mk=n=>"Halo tim,\n\nBerikut assignment "+RN[role]+" tanggal "+fmt(d)+":\n"+rows.slice(0,n).map(r=>`- ${r.client} (${r.no}) · ${r.program} · ${RN[role]}: ${r[role]}`).join("\n")+(n<rows.length?`\n- dan ${rows.length-n} project lainnya, lihat dashboard`:"")+"\n\nMohon konfirmasi penerimaan. Terima kasih.";
  let n=rows.length,href;do{href=OL_MAIL+"?"+qs({to:to.join(","),subject,body:mk(n)});n--}while(href.length>1900&&n>0);
  return `<div style="padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><a class="btn" target="_blank" rel="noopener" href="${esc(href)}">Email batch ke ${to.length} ${RN[role]}</a>${miss.length?`<span class="sub">Belum ada email: ${esc(miss.join(", "))}</span>`:""}</div>`;
}
function emailPanel(everyone){
  everyone=everyone.filter(n=>!NO_MAIL.has(n));
  const edit=DB&&CANWRITE;
  const list=everyone.map(n=>`<div style="display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)"><b style="min-width:110px">${esc(n)}</b><span style="font-family:var(--f-mono);font-size:12px;flex:1;min-width:0;overflow-wrap:anywhere">${emailOf(n)?esc(emailOf(n)):'<i class="sub">belum diisi</i>'}</span>${edit&&emailOf(n)?`<button class="btn" data-emdel="${esc(slug(n))}" aria-label="Hapus email ${esc(n)}">Hapus</button>`:""}</div>`).join("");
  const form=!DB?`<p class="note" style="margin:0 0 10px">Penyimpanan email hanya aktif di halaman Artifact, belum aktif di tampilan ini.</p>`:!CANWRITE?`<p class="note" style="margin:0 0 10px">Hanya anggota dengan akses Contributor ke atas yang bisa mengisi email.</p>`:
    `<div class="frm" style="margin-bottom:12px"><label>Nama<select id="ep">${everyone.map(n=>`<option>${esc(n)}</option>`).join("")}</select></label><label style="flex:1 1 220px">Email Outlook<input type="email" id="em" placeholder="nama@perusahaan.com"></label><button class="btn pri" id="emsave">Simpan email</button><span class="sub" id="emmsg">${esc(asg.emsg||"")}</span></div>`;
  return `<div class="panel"><h2>Email tim · untuk kirim assignment</h2>${form}${list}<p class="note">Tombol Email dan Kalender di riwayat assignment membuka Outlook di browser dengan isi yang sudah terisi, dikirim dari akun Microsoft yang sedang login di browsermu. Kamu tetap menekan Kirim sendiri. Email dan cuti yang dicatat hanya tersimpan di browser ini, tidak dibagikan ke rekan lain.</p></div>`;
}
function exportRows(){
  const hdr=["Peran","Nama","Bulan","Hari kerja (Sen-Jum)","Cuti (hari)","Hari kerja efektif","Hari dengan tugas aktif","Rata-rata beban per hari","Beban puncak","Assignment baru","Selesai"];
  const out=[hdr];
  ["certifier","reviewer"].forEach(rl=>calc(rl).recap.forEach(r=>out.push([rl==="certifier"?"Certifier":"Reviewer",r.p,asg.month,r.work,r.leave,r.eff,r.activeDays,r.avg.toFixed(2),r.peak,r.newA,r.done])));
  return out;
}
function bindAssignment(){
  const rr=()=>render("assignment");
  document.querySelectorAll("#roles [data-r]").forEach(b=>b.onclick=()=>{asg.role=b.dataset.r;rr()});
  $("#mprev").onclick=()=>{asg.month=shiftMonth(asg.month,-1);rr()};
  $("#mnext").onclick=()=>{asg.month=shiftMonth(asg.month,1);rr()};
  [0,1].forEach(i=>{const s=$("#sd"+i);s&&(s.onchange=async()=>{
    const a=+$("#sd0").value,b=+$("#sd1").value;SCHED=[a,b];
    try{await DB.doc("config/schedule").set({days:[a,b]})}catch(e){}rr()})});
  const lp=$("#lp");
  if(lp){lp.onchange=e=>{asg.lp=e.target.value};$("#lf").oninput=e=>{asg.lf=e.target.value;if(asg.lt<asg.lf){asg.lt=asg.lf;$("#lt").value=asg.lt}};$("#lt").oninput=e=>{asg.lt=e.target.value};$("#ln").oninput=e=>{asg.ln=e.target.value};
    $("#lvadd").onclick=async()=>{
      const p=$("#lp").value,f=$("#lf").value,t2=$("#lt").value||f;if(!p||!f||t2<f)return;
      const ds=[];for(let d=f,i=0;d<=t2&&i<62;i++){if(dowOf(d)%6)ds.push(d);d=isoLocal(new Date(isoD(d).getTime()+864e5))}
      try{await Promise.all(ds.map(d=>DB.doc("leave/"+lvKey(p,d)).set({person:p,date:d,note:asg.ln.slice(0,80)})));asg.ln=""}catch(e){asg.msg="Cuti gagal disimpan."}};
  }
  const es=$("#emsave");
  if(es){es.onclick=async()=>{const p=$("#ep").value,e=$("#em").value.trim().toLowerCase(),m=$("#emmsg");
    if(!okMail(e)){asg.emsg="Format email belum benar.";m.textContent=asg.emsg;return}
    try{await DB.doc("people/"+slug(p)).set({name:p,email:e});asg.emsg=""}catch(x){asg.emsg="Email gagal disimpan.";m.textContent=asg.emsg}}}
  document.querySelectorAll("[data-emdel]").forEach(b=>b.onclick=async()=>{try{await DB.doc("people/"+b.dataset.emdel).delete()}catch(e){}});
  document.querySelectorAll("[data-lvdel]").forEach(b=>b.onclick=async()=>{try{await DB.doc("leave/"+b.dataset.lvdel).delete()}catch(e){}});
  const say=m=>{asg.msg=m;const x=$("#exMsg");x&&(x.textContent=m)};
  $("#exCopy").onclick=async()=>{
    const tsv=exportRows().map(r=>r.join("\t")).join("\n");
    try{await navigator.clipboard.writeText(tsv);say("Tersalin. Tempel langsung ke Excel.")}catch(e){say("Penyalinan ditolak browser. Gunakan Unduh CSV.")}};
  $("#exCsv").onclick=async()=>{
    const csv=exportRows().map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
    try{const d=await window.claude.use("downloads");if(!d){say("Unduhan tidak tersedia di tampilan ini. Gunakan Salin.");return}
      await d.save({filename:"rekap-kerja-"+asg.month+".csv",data:csv});say("Berkas diunduh.")}catch(e){say("Unduhan dibatalkan atau tidak tersedia. Gunakan Salin.")}};
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    DB=await window.claude.use("db");if(!DB)return;
    try{const u=await window.claude.use("user");CANWRITE=u?((await u.can("data.write"))!==false):true}catch(e){CANWRITE=true}
    const redraw=()=>{if(curView==="assignment"&&!/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName||""))render("assignment")};
    DB.collection("leave").onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});LEAVE=m;redraw()},()=>{});
    DB.collection("people").onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});PEOPLE=m;redraw()},()=>{});
    DB.doc("config/schedule").onSnapshot(s=>{const d=s.exists&&s.data();if(d&&Array.isArray(d.days)&&d.days.length===2){SCHED=d.days;redraw()}},()=>{});
    if(curView==="assignment")render("assignment");
  }catch(e){DB=null}
}

const views={ringkasan:()=>[ringkasan(),()=>{document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{focus=focus===b.dataset.f?"urgent":b.dataset.f;render("ringkasan");const f=document.getElementById("focus");f&&f.scrollIntoView({behavior:"smooth",block:"nearest"})})}],project:()=>[project(),bindProject],assignment:()=>[assignment(),bindAssignment],individu:()=>[individu(),()=>{
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ind.role=b.dataset.r;ind.person=null;ind.risk="";ind.all=false;render("individu")});
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ind.person=b.dataset.p;ind.all=false;render("individu")});
  document.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{ind.risk=ind.risk===b.dataset.lg?"":b.dataset.lg;ind.all=!!ind.risk;render("individu")});
  document.querySelectorAll(".load i").forEach(i=>i.onclick=e=>{e.stopPropagation();ind.person=i.dataset.pp;ind.risk=ind.risk===i.dataset.k&&!ind.all?"":i.dataset.k;ind.all=false;render("individu")});
}]};
function render(v){curView=v;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  const [html,bind]=views[v]();$("#view").innerHTML=html;bind();
  try{history.replaceState(null,"","#"+v)}catch(e){}
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>render(b.dataset.v));
$("#today").textContent=TODAY.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
initDb();
const h=location.hash.slice(1);render(views[h]?h:"ringkasan");
window.addEventListener("hashchange",()=>{const x=location.hash.slice(1);if(views[x])render(x)});
</script>
</body>
</html>
